name: Extract and Deploy Portfolio V2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-v2-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract website ZIP
        run: |
          if [ ! -f index.html ]; then
            unzip -o portfolio-v2-github.zip
            test -f index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Extract Portfolio V2 source files"
            git push origin HEAD:main
          fi

      - name: Prepare website
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.gitignore' \
            --exclude='portfolio-v2-github.zip' \
            --exclude='README.md' \
            ./ "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/index.html"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
